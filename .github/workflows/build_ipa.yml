name: Build Debug IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    env:
      UPLOAD_IPA: ${{ vars.UPLOAD_IPA || 'true' }}

    steps:
      - name: 1. Fetch Source Code
        uses: actions/checkout@v6

      - name: Apply StikPair patch
        run: |
          set -e
          # Skip if the patch is already applied in the tree
          if git apply --reverse --check stikpair-into-stikdebug.patch 2>/dev/null; then
            echo "Patch already applied, skipping."
          else
            echo "== Checking patch =="
            git apply --check --verbose stikpair-into-stikdebug.patch
            git apply --whitespace=fix --verbose stikpair-into-stikdebug.patch
          fi
          git status --short

      - name: 2. Configure Xcode Environment
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: 3. Compile Project Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild clean archive \
            -project StikDebug.xcodeproj \
            -scheme "StikDebug" \
            -configuration Debug \
            -archivePath build/StikDebug.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            IPHONEOS_DEPLOYMENT_TARGET=17.4 2>&1 | tee build/xcodebuild.log

      - name: Show compile errors
        if: failure()
        run: |
          echo "===== ERRORS ====="
          grep -E "error:|fatal error:|Undefined symbol|linker command failed" build/xcodebuild.log | sort -u | head -50 || true

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: 4. Package .app into .ipa
        run: |
          cp -R build/StikDebug.xcarchive/Products/Applications/StikDebug.app .
          mkdir -p Payload
          cp -R StikDebug.app Payload/
          zip -r StikDebug.ipa Payload
          rm -rf Payload StikDebug.app

      - name: 5. Name workflow artifact
        id: artifact
        if: env.UPLOAD_IPA == 'true'
        run: |
          file_name="StikDebug-${GITHUB_SHA::7}.ipa"
          cp StikDebug.ipa "$file_name"
          echo "file_name=$file_name" >> "$GITHUB_OUTPUT"

      - name: 6. Store IPA as Workflow Artifact
        if: env.UPLOAD_IPA == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.file_name }}
          archive: false
          retention-days: 90

      - name: Move "latest" tag to this commit
        if: github.event_name != 'pull_request'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          name: StikDebug
          tag_name: latest
          files: StikDebug.ipa
          make_latest: true
          fail_on_unmatched_files: true
          body: "Latest build of commit ${{ github.sha }}"
